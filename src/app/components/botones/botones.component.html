<div class="d-flex justify-content-center align-items-center gap-3">
    <!-- Si el parent es 'card', mostrar iconos -->
     @if(parent == 'card'){
           <a [routerLink]="['/producto',_id ]" class="btn btn-info btn-lg" title="Ver Detalles">
                <i class="bi bi-search"></i>
           </a>     
   }

     <!-- Si el parent es 'view', mostrar botones con texto -->
     @else if (parent == 'view'){
       
       <a [routerLink]="['/home']" class="btn btn-info"> Volver al listado</a>
   }
 </div>
